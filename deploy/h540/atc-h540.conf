# Logitech H540 microphone settings. Installed as /etc/atc-h540.conf.
# Change a value, then: systemctl --user start atc-h540.service
AGC=off
# PulseAudio capture volume in percent. 70 is the value in use on 2026-11-23; the right value
# with AGC off is not measured yet. Aim: normal speech about -12 dBFS, never above -6 (D-22).
CAPTURE_PERCENT=70
